name: SQP Weekly Refresh
on:
  schedule:
    - cron: '0 3 * * 1'   # jeden Montag 03:00 UTC
  workflow_dispatch: {}    # zusätzlich manuell auslösbar
concurrency:
  group: sqp-quota         # nie parallel zum Backfill-Worker (Amazon-Quota)
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # 27.07. starb am 3h-Timeout, bevor Ads-Steps liefen (GitHub-Limit: 360)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: SQP-Refresh laufen lassen
        run: node refresh.mjs
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Produkt-Titel/SKUs aktualisieren
        run: node asin-meta.mjs
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Ads-Refresh (PPC-Luecken je ASIN)
        run: node ads-refresh.mjs
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Ads-Monatshistorie (letzte 2 Monate aktualisieren)
        run: node ads-periodic.mjs 2
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Slack-Alert bei Fehlschlag
        if: failure() || cancelled()   # Timeout = cancelled — blieb sonst stumm (20.-27.07.)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "Kein SLACK_WEBHOOK_URL-Secret — Alert übersprungen."; exit 0; }
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"❌ *${{ github.workflow }}* fehlgeschlagen — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Zum Log →>\"}" "$SLACK_WEBHOOK_URL"
