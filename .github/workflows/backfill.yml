name: SQP Backfill Queue
on:
  workflow_dispatch: {}     # sofortiger Start per Button (via Vercel-Dispatch)
  schedule:
    - cron: '30 4 * * *'    # tägliches Auffangnetz 04:30 UTC
concurrency:
  group: sqp-backfill       # nur nicht parallel zu sich selbst; 429-Handling faengt
                            # seltene Ueberschneidungen mit dem Weekly Refresh ab
jobs:
  work:
    runs-on: ubuntu-latest
    # Worker-Budget ist 230 Min (WORKER_BUDGET_MIN) + Meta/Ads-Bloecke — 300 laesst Luft,
    # statt dass der Job ins Timeout laeuft und hart gekillt wird (Jobs blieben "running").
    # Audit + Sales&Traffic laufen seit 10.08. im eigenen Workflow daily-data.yml:
    # die Step-Summe sprengte hier das Timeout, ab 04.08. wurde JEDE Nacht gecancelt.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Warteschlange abarbeiten (SQP + PPC)
        run: node backfill-worker.mjs
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Slack-Alert bei Fehlschlag
        if: failure() || cancelled()   # Timeout = cancelled — blieb sonst stumm
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "Kein SLACK_WEBHOOK_URL-Secret — Alert übersprungen."; exit 0; }
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"❌ *${{ github.workflow }}* fehlgeschlagen — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Zum Log →>\"}" "$SLACK_WEBHOOK_URL"
