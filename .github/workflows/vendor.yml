name: Vendor Sales Import
on:
  schedule:
    - cron: '30 4 * * *'   # täglich 04:30 UTC
  workflow_dispatch:
    inputs:
      client:
        description: 'Nur diesen Kunden (Namensteil, z. B. Mavi)'
        required: false
        default: ''
      months:
        description: 'Komplette Monate rückwirkend'
        required: false
        default: '12'
      since:
        description: 'Rückwirkend bis inkl. Monat (YYYY-MM, hat Vorrang vor months)'
        required: false
        default: ''
concurrency:
  group: vendor-import     # nur nicht parallel zu sich selbst — Vendor-Tokens haben eigene Quotas,
                           # die geteilte Gruppe liess Vendor-Buttonklicks wartende SQP-Läufe canceln
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vendor-Sales importieren
        run: node vendor-sales.mjs
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLIENT: ${{ github.event.inputs.client }}
          MONTHS: ${{ github.event.inputs.months }}
          SINCE: ${{ github.event.inputs.since }}
      - name: Vendor-Ads importieren (TACoS pro ASIN)
        if: always()
        run: node vendor-ads.mjs
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SINCE: ${{ github.event.inputs.since }}
      - name: Slack-Alert bei Fehlschlag
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "Kein SLACK_WEBHOOK_URL-Secret — Alert übersprungen."; exit 0; }
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"❌ *${{ github.workflow }}* fehlgeschlagen — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Zum Log →>\"}" "$SLACK_WEBHOOK_URL"
