name: Pipeline-Wächter
# Unabhängige Überwachung der Import-Pipeline — bewusst NICHT Teil der Daten-Workflows:
# deren Timeout hatte 08/2026 auch den eigenen Slack-Alert gekillt (eine Woche unbemerkt kaputt).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '30 6,17,23 * * *'   # 3× täglich (06:30, 17:30, 23:30 UTC), Laufzeit < 1 Min — kein Lauf um 11:00 UTC (Arbeitszeit des Teams): seine Frische-Abfragen lesen Millionen Zeilen. 06:30 (statt 05:30, seit 21.11.2026): die Server-Nachtkette endet ~01:30 UTC; ein Fehler soll VOR Arbeitsbeginn (~07:00 UTC) sichtbar sein
permissions:
  actions: read     # Läufe der anderen Workflows abfragen
  contents: read    # Checkout — ein permissions-Block setzt alles Ungenannte auf none!
concurrency:
  group: sqp-watchdog
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pipeline prüfen (Queue, Nachtläufe, Datenfrische)
        run: node watchdog.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
