name: Einmal-Transfer (wird danach geloescht)
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: .env per SSH auf den Worker-Server schreiben
        env:
          WORKER_SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
        run: |
          mkdir -p ~/.ssh && echo "$WORKER_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan 178.104.174.198 >> ~/.ssh/known_hosts 2>/dev/null
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY"
            echo "SPAPI_CLIENT_ID=$SPAPI_CLIENT_ID"
            echo "SPAPI_CLIENT_SECRET=$SPAPI_CLIENT_SECRET"
            echo "ADS_CLIENT_ID=$ADS_CLIENT_ID"
            echo "ADS_CLIENT_SECRET=$ADS_CLIENT_SECRET"
            echo "ADS_REFRESH_TOKEN=$ADS_REFRESH_TOKEN"
          } > env.tmp
          scp env.tmp root@178.104.174.198:/opt/sqp-ingest/.env
          ssh root@178.104.174.198 'chmod 600 /opt/sqp-ingest/.env && systemctl restart sqpr-worker && sleep 3 && systemctl is-active sqpr-worker'
          rm env.tmp && echo "übertragen + Dienst neu gestartet"
