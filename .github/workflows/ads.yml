name: Ads Refresh (PPC-Daten)
on:
  workflow_dispatch:
    inputs:
      only_profile:
        description: 'Nur dieses Ads-Profil (Diagnose/Einzeltest, leer = alle Kunden)'
        required: false
        default: ''
      dry_run_asin_cap:
        description: 'ASIN-Deckel nur simulieren (loggen statt loeschen) — zum Testen vor dem echten Lauf'
        required: false
        type: boolean
        default: false
      asin_cap_batch_size:
        description: 'ASINs pro Loesch-Batch (leer = 100). Bei 57014-Timeout kleiner setzen, z.B. 10.'
        required: false
        default: ''
  schedule:
    - cron: '30 5 * * *'   # täglich 05:30 UTC — unabhängig vom SQP-Zeitbudget
                           # (im Backfill-Worker verhungerte der Ads-Block regelmäßig)
concurrency:
  group: sqp-ads-refresh   # nicht parallel zu sich selbst (verhindert nur zwei GitHub-
                           # Actions-Läufe gegeneinander, z.B. manueller Trigger + Schedule
                           # überlappend — schützt NICHT vor dem Hetzner-Daemon, der
                           # ads-refresh/ads-periodic unabhängig alle 6h ausserhalb von
                           # GitHub Actions anstößt; dafür sind die Upserts in den beiden
                           # Skripten selbst die eigentliche Absicherung, 11.09.)

jobs:
  ads:
    runs-on: ubuntu-latest
    # War 300: der sequenzielle Kunde-fuer-Kunde-Nachzug ist mit wachsendem Kundenstamm
    # regelmaessig ins Timeout gelaufen (cancelled statt failure) und blieb dadurch
    # stumm, weil der harte Job-Timeout-Kill den Slack-Alert-Step NICHT mehr ausfuehrt —
    # der Alert ist deshalb unten in einen eigenen Job ausgelagert (03.09.). 355 ist das
    # Maximum, das GitHub-gehostete Runner ueberhaupt zulassen (Plattform-Deckel 360 Min).
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ads-Refresh (PPC-Luecken je ASIN, letzte 30 Tage)
        run: node ads-refresh.mjs
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADS_ONLY_PROFILE: ${{ github.event.inputs.only_profile }}
      - name: Ads-Historie (Monate + Wochen)
        # Taeglicher Cron-Lauf wieder aktiviert (20.09.): der 57014-Bug (seit 15.09. manuell-
        # only) ist behoben — Datenverlust-Fix (Upsert vor Loeschen statt DELETE-vor-INSERT),
        # kleinere Chunks (1000 -> 200) und Sofort-Retry bei purge_excluded_asins() sind live
        # und in zwei vollen 22-Kunden-Laeufen (#67, #68) ohne einen einzigen unbeaufsichtigten
        # 57014 oder Datenverlust bestaetigt. ads-refresh.mjs (oben) lief die ganze Zeit
        # unveraendert taeglich weiter.
        if: always()
        run: node ads-periodic.mjs 2 3
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADS_ONLY_PROFILE: ${{ github.event.inputs.only_profile }}
          ASIN_DECKEL_DRY_RUN: ${{ github.event.inputs.dry_run_asin_cap }}
          ASIN_DECKEL_BATCH: ${{ github.event.inputs.asin_cap_batch_size }}

  # Eigener Job statt Step: ein harter Job-Timeout-Kill (siehe oben) beendet den
  # laufenden Job SOFORT und fuehrt keine weiteren if:failure()/cancelled()-Steps
  # DARIN mehr aus — ein separater Job mit needs: wird davon nicht betroffen und
  # laeuft zuverlaessig, auch wenn "ads" per Timeout als cancelled endet (03.09.,
  # Wochen stumme Timeouts weil der alte Alert-Step im selben Job nie drankam).
  alert-on-failure:
    needs: ads
    if: needs.ads.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Slack-Alert bei Fehlschlag
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "Kein SLACK_WEBHOOK_URL-Secret — Alert übersprungen."; exit 0; }
          curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"❌ *${{ github.workflow }}* ${{ needs.ads.result }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Zum Log →>\"}" "$SLACK_WEBHOOK_URL"
