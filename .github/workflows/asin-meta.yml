name: ASIN Meta Refresh
on:
  workflow_dispatch: {}    # manuell: nur Produkt-Titel/SKUs neu laden (ohne SQP-Voll-Refresh)

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Produkt-Titel/SKUs aktualisieren
        run: node asin-meta.mjs
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
